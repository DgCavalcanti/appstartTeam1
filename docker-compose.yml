services:
  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hc-saa
    restart: unless-stopped

  hc-saa:
    build: .
    expose:
      - "8000"
    environment:
      ENV: production
      LOG_LEVEL: info
      # SQLite dentro do volume nomeado abaixo — sobrevive a `docker compose down`.
      SQLITE_DSN: sqlite+aiosqlite:////data/saa.db
    volumes:
      - saa_dados:/data
    restart: unless-stopped

volumes:
  saa_dados:
