[project]
name = "saa"
version = "2.0.0"
description = "SAA — Sistema de Alocação Ambulatorial: aloca grades de clínicas em pavimentos do HC"
readme = "README.md"
requires-python = ">=3.13"

# Apenas as dependências diretas. As transitivas (starlette, pydantic, numpy,
# greenlet…) são resolvidas pelo uv e ficam registradas no uv.lock.
dependencies = [
    "fastapi>=0.121",
    "uvicorn>=0.38",
    "python-dotenv>=1.2",
    # Uploads multipart — a planilha do AGHU chega por aqui.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "aiosqlite>=0.21",
    "alembic>=1.17",
    "pandas>=2.3",
    # Backend que o pandas usa para ler .xlsx. Sem ele, importar uma planilha
    # do Excel falha em runtime mesmo com a extensão sendo aceita.
    "openpyxl>=3.1",
]

# Ferramentas de teste. Ficam num grupo à parte para não irem para produção,
# mas precisam estar declaradas: sem isso, um `uv sync` remove pytest e httpx
# do ambiente e a suíte simplesmente para de rodar.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# A raiz do projeto precisa entrar no sys.path para os testes importarem `src`.
# Sem isto, `pytest` só funciona invocado como `python -m pytest`, que insere o
# diretório atual por conta própria — e o comando do README quebraria.
pythonpath = ["."]
testpaths = ["tests"]
